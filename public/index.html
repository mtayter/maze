<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <!-- App version stamp: must match version.json. Bump BOTH together in
       any commit that changes files under public/ (see README). -->
  <meta name="app-version" content="4.8.2">
  <title>Maze</title>
  <link rel="icon" href="maze-icon.svg">
  <link rel="stylesheet" href="maze.css?v=4.8.2">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="signed-out">
  <noscript>Please enable JavaScript to use this app.</noscript>
  <header id="shellbar">
    <span class="brand"><img class="brand-icon" src="maze-icon.svg" alt=""> Maze</span>
    <nav class="shell-nav" aria-label="Main">
      <a href="#/play" id="navPlay">▶️ Play</a>
      <a href="#/create" id="navCreate">✏️ Create</a>
      <a href="#/settings" id="navSettings">⚙️ Settings</a>
      <a href="#/admin" id="navAdmin" style="display:none">🛡️ Admin</a>
    </nav>
    <div id="authSlot"><!-- SSO sign-in lands here in a later phase --></div>
  </header>
  <main id="view"></main>
  <div id="updateBanner" role="alert">
    <span>✨ A new version of Maze is available.</span>
    <button class="btn btn-primary" id="updateReloadBtn" type="button">Reload now</button>
    <button class="btn" id="updateDismissBtn" type="button">Later</button>
  </div>
  <script type="module" src="app.js?v=4.8.2"></script>
</body>

</html>
